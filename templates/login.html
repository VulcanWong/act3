<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial=scale=1.0">
        <title>Login</title>
        <style>

           * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: sans-serif;
                background-color:violet;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .container {
                background-color:cyan;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 10px plum;
                width: 100%;
                max-width: 400px;
            }

            h1 {
                text-align: center;
                margin-bottom:20px;
                color:darkviolet;
            }

            form {
                display:flex;
                flex-direction: column;
            }

            form label {
                margin-bottom: 5px;
                font-weight:bold;
            }

            form input{
                padding: 10px;
                margin-bottom: 15px;
                border: 1px solid aquamarine;
                border-radius: 6px;
                font-size: 16px;
            }

            form button {
                padding: 10px;
                border:none;
                background-color: darkmagenta;
                color: rgb(235, 252, 0);
                font-size: 16px;
                cursor: pointer;
                border-radius: 4px;
                transition: background-color 0.3s;

            }

            form button:hover{
                background-color:darkorchid;
            }
            a {
                color:blue;
                text-decoration: underline;
                text-align: center;
                margin-top: 10px;

            }

            a:hover {
                text-decoration:underline;
                        }
            ul {
                list-style-type: none;
                margin-top: 10px;
                padding: 0px;
            }

            ul li {
                background-color:rgba(161, 42, 142, 0.719);
                color:rgba(40, 40, 165, 0.616);
                padding: 10px;
                border-radius: 4px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Login</h1>
            <form method="POST" action="{{ url_for('login') }}">
                <label>Username: </label><input type="text" name="username" required><br>
                <label>Password: </label><input type="password" name="password" required><br>
                <button type="submit">Login</button>

            </form>
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
            {% with messages = get_flashed_messages() %}
                {% if messages%}
                    <ul>
                        {% for messages in messages %}
                            <li>{{ messages }}</li>
                        {% endfor %}

                    </ul>
                {% endif %}
            {% endwith %}
        </div>
    </body>
</html>
